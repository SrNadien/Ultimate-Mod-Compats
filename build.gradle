plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version =minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

runs {
    configureEach {
        workingDirectory project.file('run')

        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource sourceSets.main
    }

    client {
        systemProperty 'umc.kubejs.registerAll', 'true'
        if (project.hasProperty('minimalRuntime')) {
            // the test with none of the optional mods has a folder of its own, so it never opens the world of the development game
            workingDirectory project.file('run-minimal')
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        } else if (project.hasProperty('isolatedRun')) {
            // the same with every mod, to check that it loads without opening the world of the development game
            workingDirectory project.file('run-isolated')
        } else {
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }
    }

    server {
        programArgument '--nogui'
    }

    data {
        workingDirectory project.file('run-data')

        programArguments.addAll '--mod', mod_id,
                                '--all',
                                '--output', file('src/generated/resources/').getAbsolutePath(),
                                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    // Maven oficial de cada mod
    maven {
        name = 'Favouriteless Maven'
        url = 'https://maven.favouriteless.dev/releases'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'BlakeBr0'
        url = 'https://maven.blakesmods.com'
        content {
            includeGroup 'com.blakebr0.mysticalagriculture'
            includeGroup 'com.blakebr0.mysticalagradditions'
            includeGroup 'com.blakebr0.cucumber'
        }
    }
    maven {
        name = 'Fractal'
        url = 'https://maven.is-immensely.gay/releases'
        content {
            includeGroup 'de.dafuqs'
        }
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'dev.engine-room.vanillin'
        }
    }
    maven {
        name = 'Zeith'
        url = 'https://maven.zeith.org/'
        content {
            includeGroup 'org.zeith.solarflux'
            includeGroup 'org.zeith.hammerlib'
        }
    }
    maven {
        name = 'Rover656'
        url = 'https://maven.rover656.dev/releases'
        content {
            includeGroup 'com.enderio'
        }
    }
    maven {
        name = 'IThundxR'
        url = 'https://maven.ithundxr.dev/snapshots'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }

    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }

    // Los mods sin Maven oficial van por CurseMaven, siempre al final
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // -PminimalRuntime starts the game with only the mods this one needs, to check that it loads with none of the optional ones
    def minimalRuntime = project.hasProperty('minimalRuntime')
    def optionalRuntime = { Object notation, Closure config = null ->
        if (!minimalRuntime) {
            if (config != null) {
                runtimeOnly(notation, config)
            } else {
                runtimeOnly(notation)
            }
        }
    }
    implementation "net.neoforged:neoforge:${neo_version}"

    // Maven oficial
    compileOnly("net.favouriteless.enchanted:enchanted-neoforge-${minecraft_version}:${enchanted_version}") {
        exclude group: "software.bernie.geckolib"
    }
    optionalRuntime("net.favouriteless.enchanted:enchanted-neoforge-${minecraft_version}:${enchanted_version}") {
        exclude group: "software.bernie.geckolib"
    }
    implementation("de.dafuqs:Fractal:${fractal_maven_version}") { transitive = false }
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    optionalRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    optionalRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    optionalRuntime "dev.latvian.mods:rhino:${rhino_version}"
    optionalRuntime("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }

    optionalRuntime("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_runtime_version}") { transitive = false }
    optionalRuntime("com.hrznstudio:titanium:${titanium_version}") { transitive = false }
    optionalRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}") { transitive = false }
    optionalRuntime "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"

    compileOnly("com.blakebr0.mysticalagriculture:MysticalAgriculture:1.21.1-${mysticalagriculture_version}") { transitive = false }
    compileOnly("com.blakebr0.cucumber:Cucumber:1.21.1-${cucumber_version}") { transitive = false }
    optionalRuntime("com.blakebr0.mysticalagriculture:MysticalAgriculture:1.21.1-${mysticalagriculture_version}") { transitive = false }
    optionalRuntime("com.blakebr0.cucumber:Cucumber:1.21.1-${cucumber_version}") { transitive = false }
    optionalRuntime("com.blakebr0.mysticalagradditions:MysticalAgradditions:1.21.1-${mysticalagradditions_version}") { transitive = false }

    optionalRuntime("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    optionalRuntime("org.appliedenergistics:guideme:${guideme_version}") { transitive = false }

    optionalRuntime("com.simibubi.create:create-${minecraft_version}:${create_maven_version}") { transitive = false }
    optionalRuntime("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }
    optionalRuntime("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    optionalRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") { transitive = false }
    optionalRuntime("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}") { transitive = false }

    compileOnly("com.enderio:enderio:${enderio_version}") { transitive = false }
    compileOnly("com.enderio:endercore:${endercore_version}") { transitive = false }
    compileOnly("com.hrznstudio:titanium:${titanium_version}") { transitive = false }
    compileOnly("mekanism:Mekanism:${mekanism_version}") { transitive = false }
    optionalRuntime("mekanism:Mekanism:${mekanism_version}") { transitive = false }
    compileOnly("com.buuz135:industrialforegoing:${industrialforegoing_version}") { transitive = false }
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_maven_version}") { transitive = false }
    compileOnly("org.zeith.solarflux:SolarFluxReborn-1.21.1:${solarflux_version}") { transitive = false }
    compileOnly("org.zeith.hammerlib:HammerLib-1.21:${hammerlib_version}") { transitive = false }
    optionalRuntime("org.zeith.solarflux:SolarFluxReborn-1.21.1:${solarflux_version}") { transitive = false }
    optionalRuntime("org.zeith.hammerlib:HammerLib-1.21:${hammerlib_version}") { transitive = false }
    optionalRuntime("com.enderio:enderio:${enderio_version}") { transitive = false }
    optionalRuntime("com.buuz135:industrialforegoing:${industrialforegoing_version}") { transitive = false }
    optionalRuntime("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_maven_version}") { transitive = false }
    optionalRuntime("vazkii.patchouli:Patchouli:${patchouli_version}") { transitive = false }

    // CurseMaven: mods sin Maven oficial, siempre al final
    optionalRuntime "curse.maven:allthemodium-${allthemodium_id}:${allthemodium_file_id}"
    optionalRuntime "curse.maven:allthecompressed-${allthecompressed_id}:${allthecompressed_file_id}"
    optionalRuntime "curse.maven:xycraft-${xycraft_core_id}:${xycraft_core_file_id}"
    optionalRuntime "curse.maven:xycraft-world-${xycraft_world_id}:${xycraft_world_file_id}"
    optionalRuntime "curse.maven:advancedae-${advancedae_id}:${advancedae_file_id}"
    optionalRuntime "curse.maven:extendedae-${extendedae_id}:${extendedae_file_id}"
    optionalRuntime "curse.maven:glodium-${glodium_id}:${glodium_file_id}"
    optionalRuntime "curse.maven:aaron-${aaron_id}:${aaron_file_id}"
    optionalRuntime "curse.maven:excessive-utilities-${excessive_utilities_id}:${excessive_utilities_file_id}"
    optionalRuntime "curse.maven:functional-storage-${functionalstorage_id}:${functionalstorage_file_id}"
    optionalRuntime "curse.maven:generator-galore-${generatorgalore_id}:${generatorgalore_file_id}"
    optionalRuntime "curse.maven:lithostitched-${lithostitched_id}:${lithostitched_file_id}"
    optionalRuntime "curse.maven:mystical-extended-tier-${mysticalextendedtier_id}:${mysticalextendedtier_file_id}"
    compileOnly "curse.maven:functional-storage-${functionalstorage_id}:${functionalstorage_file_id}"
    compileOnly "curse.maven:thaumaturge-${thaumaturge_id}:${thaumaturge_file_id}"
    optionalRuntime "curse.maven:thaumaturge-${thaumaturge_id}:${thaumaturge_file_id}"
    optionalRuntime "curse.maven:ultimate-armoury-tools-and-weapons-${ultimatearmoury_id}:${ultimatearmoury_file_id}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        loader_version: loader_version,
        enchanted_version: enchanted_version,
        geckolib_version: geckolib_version,
        kubejs_version: kubejs_version,
        fractal_version: fractal_version,
        ae2_version: ae2_version,
        create_version: create_version,
        mysticalagriculture_version: mysticalagriculture_version,
        mysticalagradditions_version: mysticalagradditions_version,
        mysticalextendedtier_version: mysticalextendedtier_version,
        advancedae_version: advancedae_version,
        extendedae_version: extendedae_version,
        generatorgalore_version: generatorgalore_version,
        allthemodium_version: allthemodium_version,
        allthecompressed_version: allthecompressed_version,
        xycraft_version: xycraft_version,
        excessive_utilities_version: excessive_utilities_version,
        functionalstorage_version: functionalstorage_version,
        thaumaturge_version: thaumaturge_version,
        ultimatearmoury_version: ultimatearmoury_version,
        enderio_version: enderio_version,
        solarflux_version: solarflux_version,
        hammerlib_version: hammerlib_version,
        industrialforegoing_version: industrialforegoing_version,
        ars_nouveau_version: ars_nouveau_version,
        agricraft_version: agricraft_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_named: mod_named,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // The tags of the game and of the common namespace get blocks and items of this mod and of the other ones, and the tags of
    // this mod get its own. A tag is not loaded at all when one of its entries does not exist, which would break the tags of
    // the game (logs, planks, leaves...) for whoever does not have those mods, so those entries are made optional.
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        fileTree(dir: destinationDir, include: 'data/**/tags/**/*.json').each { File file ->
            def json = slurper.parse(file)
            if (!(json instanceof Map) || !(json.values instanceof List)) {
                return
            }
            def path = file.path.replace('\\', '/')
            boolean shared = path.contains('/data/minecraft/tags/') || path.contains('/data/c/tags/')
            boolean changed = false
            json.values = json.values.collect { value ->
                if (value instanceof CharSequence) {
                    String id = value.toString()
                    String bare = id.startsWith('#') ? id.substring(1) : id
                    String namespace = bare.contains(':') ? bare.substring(0, bare.indexOf(':')) : 'minecraft'
                    if (namespace == 'umc' || (shared && namespace != 'minecraft')) {
                        changed = true
                        return [id: id, required: false]
                    }
                }
                return value
            }
            if (changed) {
                file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            }
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_name,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        resources {
            exclude '.cache'
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
